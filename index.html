<html lang="en" data-theme="light" style="color-scheme: light;">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>TOPBAR — Premium Vaping Experience</title>
    <meta
      name="description"
      content="TOPBAR — premium disposable vapes engineered for smooth, consistent flavor. Explore the 8000, 40000, 50000, and 60000 puff series."
    />
    <meta name="theme-color" content="#0a0a0a" />

    <link rel="preload" as="image" href="/images/topbar-logo.png" fetchpriority="high" />
    <!-- LCP hero (first slide in src/data/homeSections.json). Update href if slide order changes. -->
    <link
      rel="preload"
      as="image"
      href="/images/hero/topbar-60000-hero-2-960w.webp"
      type="image/webp"
      fetchpriority="high"
    />
    <script>
      (function () {
        if (location.pathname !== '/products/topbar-40000-puffs') return
        var link = document.createElement('link')
        link.rel = 'preload'
        link.as = 'image'
        link.href = '/images/products/topbar-40000-colors/watermelon-ice-960w.webp'
        link.type = 'image/webp'
        link.fetchPriority = 'high'
        document.head.appendChild(link)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
